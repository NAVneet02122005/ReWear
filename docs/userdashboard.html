<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReWear - User Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="userdashboard.css">
    <link rel="icon" href="logo.png" type="image/png">
    <script src="config.js"></script>
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <h2>Re<span>Wear</span></h2>
                </a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="userdashboard.html" class="nav-link active">
                        <i class="fas fa-shopping-cart"></i>
                        <span>My Cart</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="browse.html" class="nav-link">
                        <i class="fas fa-store"></i>
                        <span>Shop</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="upload.html" class="nav-link">
                        <i class="fas fa-upload"></i>
                        <span>Upload</span>
                    </a>
                </li>
                <li class="nav-item" id="admin-panel-link" style="display:none;">
                    <a href="adminPanel.html" class="nav-link">
                        <i class="fas fa-user-shield"></i>
                        <span>Admin Panel</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" id="logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </div>
        
        <div class="main-content">
            <div class="header">
                <h1>My Dashboard</h1>
                <div class="user-info">
                    <img id="user-avatar" src="https://randomuser.me/api/portraits/lego/1.jpg" alt="User" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px;">
                    <span id="username">User</span>
                </div>
            </div>
            
            <div class="dashboard-cards">
                <div class="card">
                    <h3>Cart Items</h3>
                    <p id="totalListings" style="font-size: 2rem; font-weight: bold; color: #3C2A21;">0</p>
                </div>
                <div class="card">
                    <h3>Total Purchases</h3>
                    <p id="purchaseCount" style="font-size: 2rem; font-weight: bold; color: #3C2A21;">0</p>
                </div>
                <div class="card">
                    <h3>Messages</h3>
                    <p id="messageCount" style="font-size: 2rem; font-weight: bold; color: #3C2A21;">0</p>
                </div>
            </div>
            
            <div class="listings-container">
                <div class="tab-header">
                    <div class="tab-link active" data-tab="cart-tab">
                        <i class="fas fa-shopping-cart"></i> My Cart
                    </div>
                    <div class="tab-link" data-tab="purchases-tab">
                        <i class="fas fa-history"></i> Purchase History
                    </div>
                    <div class="tab-link" data-tab="messages-tab">
                        <i class="fas fa-envelope"></i> Messages 
                        <span id="unread-count" class="unread-badge" style="display: none;">0</span>
                    </div>
                </div>
                
                <div class="tab-content active" id="cart-tab">
                    <div class="cart-header" style="margin-bottom: 20px;">
                        <button id="purchase-all-btn" class="purchase-all-btn" style="display: none; background: #27ae60; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">
                            <i class="fas fa-shopping-cart"></i> Purchase All Items
                        </button>
                    </div>
                    <div class="item-grid" id="myListingsGrid">
                        <p style="text-align: center; padding: 40px; color: #666;">Loading cart items...</p>
                    </div>
                </div>
                
                <div class="tab-content" id="purchases-tab" style="display: none;">
                    <div class="item-grid" id="purchasesGrid">
                        <p style="text-align: center; padding: 40px; color: #666;">Loading purchase history...</p>
                    </div>
                </div>
                
                <div class="tab-content" id="messages-tab" style="display: none;">
                    <div class="messages-container" id="messagesContainer">
                        <p style="text-align: center; padding: 40px; color: #666;">Loading messages...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="userdashboard.js"></script>
</body>
</html>
